<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thermal Printer WASM Gateway - Pure Custom Web Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --card-border: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --accent-cyan: #06b6d4;
        --success: #10b981;
        --danger: #ef4444;
        --font-sans: "Inter", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-sans);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }

      .container {
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      header {
        text-align: center;
        margin-bottom: 0.5rem;
      }

      header h1 {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #818cf8, #c084fc, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
      }

      header p {
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      }

      .card-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.8rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        background: #334155;
        color: var(--text-muted);
      }

      .status-badge.connected {
        background: rgba(16, 185, 129, 0.15);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
      }

      .status-badge.connected .status-dot {
        background: var(--success);
        box-shadow: 0 0 8px var(--success);
      }

      .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      button {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 0.7rem 1.2rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      button:hover:not(:disabled) {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.btn-cyan {
        background: var(--accent-cyan);
        color: #0f172a;
      }

      button.btn-cyan:hover:not(:disabled) {
        background: #22d3ee;
      }

      button.btn-outline {
        background: transparent;
        border: 1px solid var(--card-border);
        color: var(--text-main);
      }

      button.btn-outline:hover:not(:disabled) {
        background: #334155;
      }

      button.btn-danger {
        background: var(--danger);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .form-group label {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        background: #0f172a;
        border: 1px solid var(--card-border);
        color: var(--text-main);
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        font-size: 0.9rem;
        font-family: inherit;
      }

      .form-group textarea {
        font-family: var(--font-mono);
        resize: vertical;
      }

      .log-box {
        background: #090d16;
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 1rem;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        height: 180px;
        overflow-y: auto;
        color: #38bdf8;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .log-entry {
        line-height: 1.4;
      }

      .log-entry.error {
        color: #f87171;
      }

      .log-entry.success {
        color: #4ade80;
      }

      canvas {
        background: #ffffff;
        border-radius: 4px;
        margin-top: 0.5rem;
      }

      .tabs {
        display: flex;
        gap: 0.5rem;
        border-bottom: 1px solid var(--card-border);
        margin-bottom: 1rem;
      }

      .tab-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 0.6rem 1rem;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        font-size: 0.9rem;
      }

      .tab-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🖨️ Universal Web Thermal Printer</h1>
        <p>
          Customizable Browser Gateway via Web Serial & Web USB API (Controlled
          100% from Web JS)
        </p>
      </header>

      <!-- Connection Card -->
      <div class="card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
          "
        >
          <div class="card-title">🔌 Printer Connection</div>
          <div id="statusBadge" class="status-badge">
            <span class="status-dot"></span>
            <span id="statusText">Disconnected</span>
          </div>
        </div>

        <div class="btn-group">
          <button id="btnConnectSerial">
            🔌 Connect Web Serial (Recommended)
          </button>
          <button id="btnConnectUSB" class="btn-cyan">
            🔌 Connect Web USB
          </button>
          <button id="btnTestPrint" class="btn-outline" disabled>
            🧪 Test Print
          </button>
          <button id="btnDisconnect" class="btn-danger" disabled>
            🛑 Disconnect
          </button>
        </div>
      </div>

      <!-- Custom Print Studio -->
      <div class="card">
        <div class="card-title">🎨 Custom Print Studio</div>

        <div class="tabs">
          <button class="tab-btn active" onclick="openTab(event, 'tabText')">
            📝 Custom Text
          </button>
          <button class="tab-btn" onclick="openTab(event, 'tabCanvas')">
            🖼️ Canvas Graphic
          </button>
          <button class="tab-btn" onclick="openTab(event, 'tabRaw')">
            ⚡ Raw ESC/POS Bytes
          </button>
        </div>

        <!-- Tab 1: Custom Text -->
        <div id="tabText" class="tab-content active">
          <div class="form-grid">
            <div class="form-group" style="grid-column: 1 / -1">
              <label>Text Content (Support multiline & custom layouts)</label>
              <textarea id="customText" rows="6">
TOKO UTAMA JAYA
Jl. Mawar No. 88, Jakarta
--------------------------------
No Nota : TRX-2026-001
Kasir   : Admin
--------------------------------
Kopi Latte      2x @20.000 = 40.000
Roti Toast      1x @15.000 = 15.000
--------------------------------
Total                      = 55.000
================================
Terima Kasih atas Kunjungan Anda!</textarea
              >
            </div>
            <div class="form-group">
              <label>Alignment</label>
              <select id="textAlign">
                <option value="left">Left</option>
                <option value="center" selected>Center</option>
                <option value="right">Right</option>
              </select>
            </div>
            <div class="form-group">
              <label>Cetak Bold</label>
              <select id="textBold">
                <option value="false">Tidak (Normal)</option>
                <option value="true">Ya (Bold)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Cut Kertas</label>
              <select id="textCut">
                <option value="true" selected>Ya (Potong Kertas)</option>
                <option value="false">Tidak</option>
              </select>
            </div>
          </div>
          <button id="btnPrintCustomText" disabled>🖨️ Print Custom Text</button>
        </div>

        <!-- Tab 2: Canvas Graphic -->
        <div id="tabCanvas" class="tab-content">
          <div class="form-group">
            <label>HTML5 Canvas Graphic Render Preview:</label>
            <canvas id="previewCanvas" width="384" height="140"></canvas>
          </div>
          <div class="btn-group" style="margin-top: 1rem">
            <button id="btnPrintCustomCanvas" class="btn-cyan" disabled>
              🖼️ Print Canvas Image
            </button>
          </div>
        </div>

        <!-- Tab 3: Raw Bytes -->
        <div id="tabRaw" class="tab-content">
          <div class="form-group">
            <label>ESC/POS Hex or Decimal Bytes (Comma separated):</label>
            <input
              type="text"
              id="rawBytesInput"
              value="27,64,27,97,49,80,82,73,78,84,69,82,32,79,75,10,10,10,29,86,65,48"
            />
          </div>
          <div class="btn-group" style="margin-top: 1rem">
            <button id="btnPrintRawBytes" class="btn-outline" disabled>
              ⚡ Send Raw Bytes
            </button>
          </div>
        </div>
      </div>

      <!-- Console Log Card -->
      <div class="card">
        <div class="card-title">💻 Operation Logs</div>
        <div id="logBox" class="log-box">
          <div class="log-entry">Initializing WASM printer engine...</div>
        </div>
      </div>
    </div>

    <!-- Load Go WASM Runtime & SDK -->
    <script src="wasm_exec.js"></script>
    <script src="printer-sdk.js"></script>

    <script>
      const printer = new ThermalPrinterSDK();

      const logBox = document.getElementById("logBox");
      const statusBadge = document.getElementById("statusBadge");
      const statusText = document.getElementById("statusText");

      const btnConnectSerial = document.getElementById("btnConnectSerial");
      const btnConnectUSB = document.getElementById("btnConnectUSB");
      const btnTestPrint = document.getElementById("btnTestPrint");
      const btnDisconnect = document.getElementById("btnDisconnect");

      const btnPrintCustomText = document.getElementById("btnPrintCustomText");
      const btnPrintCustomCanvas = document.getElementById(
        "btnPrintCustomCanvas",
      );
      const btnPrintRawBytes = document.getElementById("btnPrintRawBytes");

      function log(msg, type = "info") {
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString();
        entry.textContent = `[${time}] ${msg}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
      }

      function openTab(evt, tabName) {
        document
          .querySelectorAll(".tab-content")
          .forEach((tc) => tc.classList.remove("active"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((tb) => tb.classList.remove("active"));
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
      }

      function updateUIStatus() {
        const status = printer.getStatus();
        if (status.connected) {
          statusBadge.classList.add("connected");
          statusText.textContent = `Connected (${status.mode.toUpperCase()})`;
          btnTestPrint.disabled = false;
          btnDisconnect.disabled = false;
          btnPrintCustomText.disabled = false;
          btnPrintCustomCanvas.disabled = false;
          btnPrintRawBytes.disabled = false;
        } else {
          statusBadge.classList.remove("connected");
          statusText.textContent = "Disconnected";
          btnTestPrint.disabled = true;
          btnDisconnect.disabled = true;
          btnPrintCustomText.disabled = true;
          btnPrintCustomCanvas.disabled = true;
          btnPrintRawBytes.disabled = true;
        }
      }

      function drawSampleCanvas() {
        const canvas = document.getElementById("previewCanvas");
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#000000";
        ctx.font = "bold 16px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("CUSTOM CANVAS RECEIPT", canvas.width / 2, 30);

        ctx.font = "bold 28px monospace";
        ctx.fillText("#INV-2026", canvas.width / 2, 75);

        ctx.font = "12px Inter, sans-serif";
        ctx.fillText(
          "100% Client-Side Web Assembly Driver",
          canvas.width / 2,
          115,
        );
      }

      async function initApp() {
        try {
          await printer.init();
          log("Go WASM Universal Printer Gateway loaded ready.", "success");
          drawSampleCanvas();
        } catch (err) {
          log(`Failed to init WASM: ${err.message}`, "error");
        }
      }

      btnConnectSerial.addEventListener("click", async () => {
        try {
          log("Requesting Web Serial port permission...");
          await printer.connectSerial(9600);
          log("Web Serial printer connected!", "success");
          updateUIStatus();
        } catch (err) {
          log(`Web Serial Error: ${err.message || err}`, "error");
        }
      });

      btnConnectUSB.addEventListener("click", async () => {
        try {
          log("Requesting Web USB device permission...");
          await printer.connectUSB(1);
          log("Web USB printer connected!", "success");
          updateUIStatus();
        } catch (err) {
          log(`Web USB Error: ${err.message || err}`, "error");
        }
      });

      btnTestPrint.addEventListener("click", async () => {
        try {
          log("Sending test print...");
          await printer.testPrint();
          log("Test print sent!", "success");
        } catch (err) {
          log(`Test Print Error: ${err.message || err}`, "error");
        }
      });

      btnDisconnect.addEventListener("click", async () => {
        try {
          await printer.close();
          log("Printer disconnected.");
          updateUIStatus();
        } catch (err) {
          log(`Disconnect Error: ${err.message || err}`, "error");
        }
      });

      btnPrintCustomText.addEventListener("click", async () => {
        try {
          const text = document.getElementById("customText").value;
          const align = document.getElementById("textAlign").value;
          const bold = document.getElementById("textBold").value === "true";
          const cut = document.getElementById("textCut").value === "true";

          log("Sending Custom Text print payload...");
          const bytesWritten = await printer.print({
            type: "text",
            text: text,
            align: align,
            bold: bold,
            cut: cut,
            feed: 3,
          });
          log(
            `Custom text printed successfully (${bytesWritten} bytes sent)`,
            "success",
          );
        } catch (err) {
          log(`Print Custom Text Error: ${err.message || err}`, "error");
        }
      });

      btnPrintCustomCanvas.addEventListener("click", async () => {
        try {
          log("Converting Canvas to Base64 image...");
          const canvas = document.getElementById("previewCanvas");
          const b64 = canvas.toDataURL("image/png");

          log("Sending Image Base64 payload...");
          const bytesWritten = await printer.print({
            type: "image",
            base64: b64,
          });
          log(
            `Canvas graphic printed successfully (${bytesWritten} bytes sent)`,
            "success",
          );
        } catch (err) {
          log(`Print Canvas Error: ${err.message || err}`, "error");
        }
      });

      btnPrintRawBytes.addEventListener("click", async () => {
        try {
          const input = document.getElementById("rawBytesInput").value;
          const byteArray = input
            .split(",")
            .map((x) => parseInt(x.trim(), 10))
            .filter((x) => !isNaN(x));
          const uint8Arr = new Uint8Array(byteArray);

          log(`Sending Raw ESC/POS Bytes (${uint8Arr.length} bytes)...`);
          const bytesWritten = await printer.print({
            type: "raw",
            bytes: uint8Arr,
          });
          log(`Raw Bytes sent successfully (${bytesWritten} bytes)`, "success");
        } catch (err) {
          log(`Print Raw Bytes Error: ${err.message || err}`, "error");
        }
      });

      window.addEventListener("load", initApp);
    </script>
  </body>
</html>
